name: Release

# Builds pulsr for macOS and Linux and attaches the archives to a draft
# GitHub release, to be looked over and published by hand.
#
# Start it by pushing a version tag:
#
#   git tag v0.2.0 && git push origin v0.2.0
#
# The tag has to be the version in Cargo.toml with a `v` in front. A suffix
# after a hyphen (v0.2.0-rc1) is allowed and marks the release as a
# pre-release. Running the workflow by hand with a tag builds that tag
# again and replaces the files on its release.
#
# The Linux builds are linked statically against musl, so one file runs on
# any distribution.
#
# The macOS build carries the ad hoc signature the linker gives it and
# nothing more: no certificate, and so no secrets in this workflow. It is
# meant to be installed with Homebrew, which does not mark what it
# downloads as quarantined. A copy downloaded with a browser is
# quarantined, and macOS will not run it until that is cleared.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'An existing tag to build, such as v0.2.0'
        required: true
        type: string

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ inputs.tag || github.ref_name }}
  GH_REPO: ${{ github.repository }}

jobs:
  draft:
    name: Draft the release
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false

      - name: Check the tag against Cargo.toml
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          tagged=${TAG#v}
          if [ "v$tagged" != "$TAG" ] || [ "${tagged%%-*}" != "$version" ]; then
            echo "::error::tag $TAG does not match version $version in Cargo.toml"
            exit 1
          fi

      - name: Create the draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG is already there; its files will be replaced"
            exit 0
          fi
          prerelease=
          case "$TAG" in *-*) prerelease=--prerelease ;; esac
          gh release create "$TAG" --draft --verify-tag --generate-notes --title "pulsr ${TAG#v}" $prerelease

  build:
    name: Build (${{ matrix.platform }})
    needs: draft
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # `platform` is what the archive is called; `target` is Rust's
          # own name for the same thing.
          - platform: macos-apple-silicon
            target: aarch64-apple-darwin
            runner: macos-15
          - platform: linux-x86_64
            target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
          - platform: linux-arm64
            target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
    env:
      TARGET: ${{ matrix.target }}
      PLATFORM: ${{ matrix.platform }}
      # The oldest macOS with the audio tap pulsr captures through.
      MACOSX_DEPLOYMENT_TARGET: '14.2'
      CARGO_PROFILE_RELEASE_STRIP: symbols
      BINARY: target/${{ matrix.target }}/release/pulsr
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false

      # The runners come with rustup.
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --target "$TARGET" --no-self-update
          rustup default stable
          rustc --version

      - name: Test
        run: cargo test --locked --target "$TARGET"

      - name: Build
        run: cargo build --locked --release --target "$TARGET"

      # Each runner is the machine its target is for, so the binary can be
      # run where it was built.
      - name: Check the binary
        run: |
          binary="$BINARY"
          file "$binary"
          "$binary" -help
          case "$TARGET" in
            *-linux-musl)
              if file "$binary" | grep -q 'dynamically linked'; then
                echo "::error::the binary is not static"
                exit 1
              fi
              ;;
            *-apple-darwin)
              # Apple silicon runs nothing unsigned, and an ad hoc
              # signature names nobody.
              codesign --verify --strict "$binary"
              signature=$(codesign -dvv "$binary" 2>&1)
              if ! printf '%s\n' "$signature" | grep -q '^Signature=adhoc$' ||
                 printf '%s\n' "$signature" | grep -q '^Authority='; then
                echo "::error::the binary is not signed ad hoc"
                exit 1
              fi
              ;;
          esac

      - name: Package
        run: |
          name="pulsr-${TAG#v}-$PLATFORM"
          mkdir "$name"
          cp "$BINARY" README.md "$name/"
          if [ -f LICENSE ]; then cp LICENSE "$name/"; fi
          tar -czf "$name.tar.gz" "$name"
          if command -v sha256sum >/dev/null; then
            sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
          else
            shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
          fi
          cat "$name.tar.gz.sha256"
          echo "ARCHIVE=$name.tar.gz" >> "$GITHUB_ENV"

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "$ARCHIVE" "$ARCHIVE.sha256" --clobber
